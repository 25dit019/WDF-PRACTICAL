<input type="text" class="input-field"><br><br>

<label><b>Email</b></label><br><br>
<input type="email" class="input-field"><br><br>

<textarea rows="5" cols="30"></textarea><br><br>

<input type="submit"
       value="Send"
       onclick="alert('Message Sent Successfully')"
       class="send-button">

<input type="reset"
       value="Clear"
       class="clear-button">

</form>
