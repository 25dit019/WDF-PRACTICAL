<!DOCTYPE html>
<html>
<head>
    <title>Contact Us - StudentHub</title>
    <link rel="stylesheet" href="contact.css">
</head>

<body>

<header>
    <h1 class="contact-title">Contact Us</h1>
</header>

<hr>

<nav>
    <a href="index.html" class="home">Home</a>
    <a href="login.html" class="login">Login</a>
    <a href="register.html" class="register">Register</a>
    <a href="dashboard.html" class="dashboard">Dashboard</a>
    <a href="profile.html" class="profile">Profile</a>
    <a href="courses.html" class="courses">Courses</a>
    <a href="assignments.html" class="assignments">Assignments</a>
    <a href="announcements.html" class="announcements">Announcements</a>
    <a href="timetable.html" class="timetable">Timetable</a>
    <a href="contact.html" class="contact">Contact Us</a>
</nav>

<hr>

<main>

    <section>

        <h2 class="message-title">Send Your Message</h2>

        <div class="contact-container">

            <form class="contact-form" id="contactForm" onsubmit="handleContactSubmit(event)">

                <label for="name">Name</label>
                <input type="text"
                       id="name"
                       name="name"
                       class="input-field"
                       placeholder="Enter your name"
                       value="Parthrajsinh H. Gohil"
                       required>

                <label for="email">Email</label>
                <input type="email"
                       id="email"
                       name="email"
                       class="input-field"
                       placeholder="Enter your email"
                       value="25dit019@charusat.edu.in"
                       required>

                <label for="message">Message</label>
                <textarea id="message"
                          name="message"
                          class="message-field"
                          placeholder="Enter your message"
                          rows="5"
                          required>Hello, I need assistance regarding Practical 2 submission.</textarea>

                <div class="button-container">

                    <button type="submit" class="send-button" id="sendBtn" onclick="handleContactSubmit(event)">Send</button>

                    <button type="reset" class="clear-button" id="clearBtn">Clear</button>

                </div>

            </form>

        </div>

    </section>

</main>

<hr>

<footer>
    <p class="contact-footer">
        © 2026 StudentHub Portal | Contact Us
    </p>
</footer>

<script src="contact.js"></script>

</body>
</html>
