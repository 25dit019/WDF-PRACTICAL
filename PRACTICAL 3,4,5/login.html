<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Login - StudentHub</title>
    <link rel="stylesheet" href="login.css">
</head>

<body>

<h1 class="login-title">
    Student Login
</h1>

<hr>

<div class="nav">
    <a href="index.html" class="home">Home</a> |
    <a href="login.html" class="login">Login</a> |
    <a href="register.html" class="register">Register</a> |
    <a href="dashboard.html" class="dashboard">Dashboard</a> |
    <a href="profile.html" class="profile">Profile</a> |
    <a href="courses.html" class="courses">Courses</a> |
    <a href="assignments.html" class="assignments">Assignments</a> |
    <a href="announcements.html" class="announcements">Announcements</a> |
    <a href="timetable.html" class="timetable">Timetable</a> |
    <a href="contact.html" class="contact">Contact us</a>
</div>

<hr>

<div class="form-container">

<form class="login-form" id="loginForm" onsubmit="handleLoginSubmit(event)">

<h2>Login Form</h2>

<label for="emailField"><b>Email</b></label><br><br>

<input type="email" class="input-field" id="emailField" name="email" placeholder="Enter student email" value="25dit019@charusat.edu.in" required><br><br>

<label for="passwordField"><b>Password</b></label><br><br>

<input type="password" class="input-field" id="passwordField" name="password" placeholder="Enter password" value="123456" required><br><br>

<div class="password-toggle">
    <span class="eye-icon" id="eyeIcon" onclick="togglePasswordVisibility()">👁️</span>
    <input type="checkbox" id="showPasswordCheckbox" onchange="togglePasswordVisibility()">
    <label for="showPasswordCheckbox" class="checkbox-label">Show Password</label>
</div><br><br>

<button type="submit" class="login-button" id="loginBtn" onclick="handleLoginSubmit(event)">Login</button>

<button type="reset" class="reset-button" id="resetBtn">Reset</button>

</form>

</div>

<hr>

<p class="footer-text">
     2026 StudentHub Portal login
</p>

<script src="login.js"></script>
</body>
</html>
